<head>

<title>FestivalCrew – Festivalplanung</title>
<style>
:root{color-scheme:dark;--bg:#0c0d11;--surface:#17191f;--raised:#20232c;--line:#343743;--ink:#f3f4f7;--muted:#9fa2ae;--accent:#ec445b;--good:#70d3ab;--warn:#ffd284;--shadow:0 16px 50px #0007;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#481827 0%,transparent 36%),var(--bg);color:var(--ink);min-height:100dvh;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}.app{max-width:1120px;margin:0 auto;min-height:100dvh}.header{display:flex;align-items:center;gap:14px;padding:23px 23px 12px}.mark{width:51px;height:51px;display:grid;place-items:center;background:linear-gradient(135deg,#f64661,#88273b);font-size:28px;border-radius:15px;box-shadow:0 8px 24px #ef445b47}.headline{flex:1;min-width:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#f28a9b}.headline h1{margin:3px 0 0;font-size:24px;letter-spacing:-.8px}.icon-button{height:40px;width:40px;border:1px solid var(--line);background:#26212a;color:var(--ink);border-radius:12px;font-size:19px}.festival{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 23px 19px;padding:16px 19px;background:linear-gradient(115deg,#3e1722,#251b25);border:1px solid #713344;border-radius:18px}.festival h2{font-size:18px;margin:0 0 4px}.festival p{color:#d4b1b9;font-size:12px;margin:0}.pill{font-size:11px;border-radius:30px;border:1px solid #965260;background:#512430;color:#ffbfca;padding:7px 10px;white-space:nowrap}.nav{display:flex;gap:9px;padding:0 23px 15px;overflow:auto}.nav button{border:1px solid var(--line);background:#17191fe8;padding:11px 15px;border-radius:12px;color:#aaaeba;white-space:nowrap;font-size:13px;font-weight:750}.nav button.active{border-color:#e64964;color:#fff;background:#8a263b}.content{padding:0 23px 100px}.page-title{display:flex;gap:14px;justify-content:space-between;align-items:flex-end;margin:12px 0 15px}.page-title h2{font-size:22px;letter-spacing:-.5px;margin:0}.page-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.stack{display:grid;gap:13px}.card{background:#181a21eb;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 4px 25px #0002}.card h3{font-size:16px;margin:0 0 12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:#1c1d25;border:1px solid #32343f;border-radius:15px;padding:15px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.metric b{font-size:20px;letter-spacing:-.3px}.metric b.red{color:#f87889}.metric b.green{color:var(--good)}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.tag{font-size:11px;color:#c5c6d0;border:1px solid #454650;padding:4px 8px;border-radius:20px}.action{border:none;background:var(--accent);color:white;border-radius:11px;padding:11px 15px;font-weight:800}.secondary{background:#30313c;border:1px solid #494b57;color:#f4f4f5}.ghost{border:1px solid #444650;background:transparent;color:#bfc2cc;border-radius:11px;padding:8px 10px}.danger{border:1px solid #844254;background:#451c29;color:#ffb2bf;border-radius:11px;padding:8px 11px}.mini{font-size:12px;padding:8px 11px}.list-row{display:flex;gap:11px;align-items:center;border-top:1px solid #31333d;padding:12px 0}.list-row:first-child{border-top:0;padding-top:0}.list-row:last-child{padding-bottom:0}.check{accent-color:var(--accent);height:19px;width:19px}.item-title{font-weight:750}.done{text-decoration:line-through;color:#868a98}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{color:#d0d1d9;font-size:12px;font-weight:700}.field input,.field select,.field textarea{background:#0f1117;border:1px solid #484b57;border-radius:10px;color:#fafafa;width:100%;padding:11px 12px;min-width:0;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#fa617b}.field textarea{resize:vertical;min-height:72px}.field input::placeholder{color:#6d7280}.btn-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.member-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #474954;border-radius:12px;padding:6px 9px;background:#22242d;font-size:12px}.member-chip input{accent-color:var(--accent)}.empty{text-align:center;padding:38px 14px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:6px}.notice{border:1px solid #625241;background:#2a241d;color:#ead5bd;border-radius:12px;padding:12px;font-size:12px;line-height:1.5}.success{color:var(--good)}.avatar{height:35px;width:35px;flex:0 0 35px;border-radius:50%;background:#77283c;display:grid;place-items:center;font-size:14px;font-weight:800}.chat-window{height:min(45dvh,390px);overflow:auto;border-radius:12px;background:#111219;padding:14px;display:flex;flex-direction:column;gap:11px}.bubble{align-self:flex-start;max-width:85%;padding:10px 12px;border-radius:13px;background:#282a35}.bubble.me{align-self:flex-end;background:#672638}.bubble small{display:block;font-size:10px;color:#ceafbc;margin-bottom:4px}.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.bottom-nav{display:none}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;background:#612838;color:#ff9cad;min-width:24px;padding:4px 6px;font-weight:800;font-size:11px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#b0b2bf;font-weight:800;margin:2px 0 0}.footer{color:#737786;font-size:11px;text-align:center;padding:0 20px 29px}.modal-bg{position:fixed;inset:0;z-index:40;background:#050508c9;display:flex;align-items:center;justify-content:center;padding:18px}.modal{max-width:540px;width:100%;max-height:94dvh;overflow:auto;border-radius:18px;background:#1d1f27;border:1px solid #4a4b55;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 17px}.show{display:block}.hidden{display:none!important}.receipt-preview{max-height:170px;max-width:100%;object-fit:contain;border-radius:9px}.split-overlap{color:#ffcf8a;font-size:11px}.hint{font-size:12px;color:#adb0bd;line-height:1.5}.tab-panel{display:none}.tab-panel.active{display:block}hr{border:0;border-top:1px solid #383943;margin:15px 0}select option{background:#17191f}input[type=file]{padding:8px}.column{display:grid;gap:10px}.right{text-align:right}
@media(min-width:780px){.stack.two{grid-template-columns:1.1fr .9fr}.summary{gap:14px}.metric b{font-size:25px}.card{padding:20px}.headline h1{font-size:27px}}
@media(max-width:720px){.header{padding:17px 16px 8px}.headline h1{font-size:22px}.festival{margin:10px 15px 16px;padding:14px}.nav{display:none}.content{padding:0 15px 110px}.bottom-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:15;background:#17191ff2;backdrop-filter:blur(15px);border-top:1px solid #45454d;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{display:grid;gap:4px;justify-items:center;align-items:center;border:none;background:none;color:#9296a3;font-size:10px;min-width:0}.bottom-nav button .ico{font-size:19px}.bottom-nav button.active{color:#ff7188}.metric{padding:11px}.metric b{font-size:16px}.metric small{font-size:10px}.page-title h2{font-size:20px}.row.mobile-wrap{flex-wrap:wrap}.footer{padding-bottom:90px}}
@media(max-width:350px){.bottom-nav button{font-size:8px}.bottom-nav button .ico{font-size:16px}.metric b{font-size:14px}}
</style>

<body>
<div class="app">
<header class="header"><div class="mark" aria-hidden="true">FC</div><div class="headline"><div class="eyebrow">DEINE CREW. DEIN FESTIVAL.</div><h1>FestivalCrew</h1></div><button class="icon-button" id="settingsBtn" aria-label="Einstellungen">☰</button></header>
<section class="festival"><div><h2 id="festivalName">Wacken – Crew</h2><p id="festivalInfo">Deine Planung</p></div><span class="pill">Crew</span></section>
<nav class="nav" id="desktopNav"></nav><main class="content" id="main"></main>
<footer class="footer">FestivalCrew 0.3.1 · Lokale Testversion · Unabhängiges Projekt</footer>
<nav class="bottom-nav" id="mobileNav"></nav></div>
<div id="dialog" class="hidden"></div>
<script src="./receipt-tools.js?v=0.2.0"></script>
<script>
(()=>{'use strict';
const KEY='festivalcrew-prototype-0.1.0';
const tabs=[['home','⌂','Übersicht'],['shop','☷','Listen'],['money','€','Kasse'],['lineup','▤','Festival']];
const navKey=id=>id==='pack'?'shop':id==='chat'?'lineup':id;
const sectionTabs=area=>{const opts=area==='lists'?[['shop','Einkaufen'],['pack','Packen']]:[['lineup','Timeline'],['chat','Chat']];return `<div class="segmented" role="group" aria-label="Bereich auswählen">${opts.map(x=>`<button type="button" data-tab="${x[0]}" class="${active===x[0]?'active':''}" aria-pressed="${active===x[0]}">${x[1]}</button>`).join('')}</div>`};
const uuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fresh=()=>({festival:{name:'Wacken – unsere Crew',date:'',members:[{id:'me',name:'Ich'},{id:'crew1',name:'Mitglied 2'},{id:'crew2',name:'Mitglied 3'}]},shopping:[],packing:[],ledger:[],timeline:[],chat:[],receipts:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()};
const $=x=>document.querySelector(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const n=v=>Math.round((Number(String(v??0).replace(',','.'))||0)*100)/100;
const mname=id=>state.festival.members.find(m=>m.id===id)?.name||'Unbekannt';
const opts=(chosen='me')=>state.festival.members.map(m=>`<option value="${esc(m.id)}" ${chosen===m.id?'selected':''}>${esc(m.name)}</option>`).join('');
const allchecks=()=>state.festival.members.map(m=>`<label class="member-chip"><input type="checkbox" name="participants" value="${esc(m.id)}" checked> ${esc(m.name)}</label>`).join('');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Lokaler Speicher ist voll. Bitte ältere Kassenbonbilder löschen oder Daten exportieren.');return false}};
let active='home';let notice='';let moneyEditor='';let listView='open';let packView='open';
const navbar=()=>tabs.map(t=>`<button type="button" data-tab="${t[0]}" class="${navKey(active)===t[0]?'active':''}" aria-current="${navKey(active)===t[0]?'page':'false'}"><span class="ico" aria-hidden="true">${t[1]}</span><span>${t[2]}</span></button>`).join('');
const title=(s,info)=>`<div class="page-title"><div><h2>${s}</h2><p>${info}</p></div></div>`;
const empty=(emoji,txt)=>`<div class="empty"><div class="emoji">${emoji}</div><p>${txt}</p></div>`;
const memberOptions=id=>opts(id);
const outstanding=()=>({
 buy:state.shopping.filter(x=>!x.bought).length,
 pack:state.packing.filter(x=>!x.done).length
});
function home(){
 const d=state.festival,open=outstanding(),fund=ledgerStats().fund,total=open.buy+open.pack;
 const soon=[...state.timeline].filter(x=>x.start&&new Date(x.start)>=new Date()).sort((a,b)=>a.start.localeCompare(b.start))[0];
 const next=soon?soon.band+' · '+new Date(soon.start).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):null;
 return title('Übersicht','Alles für euer gemeinsames Festival')+
 '<div class="stack">'+
 `<section class="card overview-hero">
 <small>EURE VORBEREITUNG</small><strong>${total===0?(state.shopping.length+state.packing.length?'Alles abgehakt':'Zeit für eure Planung'):'Noch '+total+' Dinge offen'}</strong>
 <p class="sub">${total===0?'Keine offenen Einträge in euren Listen.':(open.buy+' Einkäufe offen · '+open.pack+' Dinge noch nicht gepackt')}</p>
 <div class="overview-actions"><button type="button" class="action" data-modal="receipt">Bon scannen</button><button type="button" class="action secondary" data-tab="shop">Listen öffnen</button></div>
 </section>
 <div class="slim-stats" aria-label="Status">
 <div class="slim-stat"><small>Einkaufen offen</small><strong>${open.buy}</strong></div>
 <div class="slim-stat"><small>Packen offen</small><strong>${open.pack}</strong></div>
 <div class="slim-stat"><small>Festivalkasse</small><strong>${eur(fund)}</strong></div>
 </div>
 <section class="card"><h3>Was steht an?</h3><div class="task-links">
 <button type="button" class="task-link" data-tab="shop"><span><b>Einkäufe prüfen</b><small>${open.buy?open.buy+' noch nicht vollständig gekauft':'Alles auf der Liste abgehakt'}</small></span><span class="arrow" aria-hidden="true">›</span></button>
 <button type="button" class="task-link" data-tab="pack"><span><b>Packliste prüfen</b><small>${open.pack?open.pack+' noch nicht gepackt':'Alles eingepackt'}</small></span><span class="arrow" aria-hidden="true">›</span></button>
 <button type="button" class="task-link" data-tab="lineup"><span><b>Festivalplan</b><small>${next?esc(next):'Noch keine kommenden Auftritte geplant'}</small></span><span class="arrow" aria-hidden="true">›</span></button>
 </div></section>
 <div class="mobile-note">Diese Testversion speichert deine Daten nur auf diesem Gerät. Die gemeinsame Synchronisierung folgt später.</div>
 </div>`;
}


function shop(){
 const open=state.shopping.filter(x=>!x.bought).length,bought=state.shopping.filter(x=>x.bought).length;
 const visible=state.shopping.filter(x=>listView==='all'||(listView==='bought'?x.bought:!x.bought));
 const status=x=>x.bought?'Gekauft':n(x.boughtQty)>0?n(x.boughtQty)+' / '+n(x.qty)+' gekauft':'Offen';
 return title('Listen','Gemeinsam einkaufen und packen')+sectionTabs('lists')+`<div class="stack">
 <div class="card">
 <div class="section-line"><div><h3>Einkaufsliste</h3><div class="small muted">${open} offen · ${bought} erledigt</div></div>
 <button type="button" class="action secondary" data-modal="receipt">Bon scannen</button></div>
 <div class="filter-bar" role="group" aria-label="Einkäufe filtern">
 <button type="button" data-filter="shop:open" class="${listView==='open'?'active':''}" aria-pressed="${listView==='open'}">Offen</button>
 <button type="button" data-filter="shop:bought" class="${listView==='bought'?'active':''}" aria-pressed="${listView==='bought'}">Gekauft</button>
 <button type="button" data-filter="shop:all" class="${listView==='all'?'active':''}" aria-pressed="${listView==='all'}">Alle</button></div>
 ${visible.length?visible.map(x=>`<div class="list-row">
 <input class="check" aria-label="${esc(x.title)} gekauft" type="checkbox" data-check="shop" data-id="${esc(x.id)}" ${x.bought?'checked':''}>
 <div class="grow"><div class="item-title ${x.bought?'done':''}">${esc(x.title)}</div>
 <div class="small muted">${esc(x.qty)} × ${esc(x.unit)} · ${esc(mname(x.owner))}</div>
 <div class="carry-info">${esc(status(x))}</div></div>
 <div class="right"><div class="small">${eur(n(x.price)*n(x.qty))}</div><button class="ghost mini" type="button" data-delete="shop" data-id="${esc(x.id)}">Löschen</button></div>
 </div>`).join(''):empty('',state.shopping.length?(listView==='open'?'Alles eingekauft.':listView==='bought'?'Noch nichts vollständig gekauft.':'Keine Einträge.'):'Noch keine Artikel auf der Liste.')}
 </div>
 <details class="details-panel"><summary>Artikel hinzufügen</summary>
 <form id="shopForm" class="form-grid">
 <div class="field wide"><label>Artikel</label><input name="title" required maxlength="100" placeholder="z. B. Wasser, Grillfleisch"></div>
 <div class="field"><label>Menge</label><input name="qty" type="number" min="0.1" step="0.1" value="1" required></div>
 <div class="field"><label>Einheit</label><select name="unit"><option>Stück</option><option>Kiste</option><option>Packung</option><option>Flasche</option><option>kg</option><option>Liter</option></select></div>
 <div class="field"><label>Preis pro Einheit (€)</label><input name="price" type="number" min="0" step="0.01" value="0"></div>
 <div class="field"><label>Wer besorgt es?</label><select name="owner">${opts()}</select></div>
 <div class="btn-row"><button class="action">Speichern</button></div></form>
 </details></div>`;
}
function pack(){
 const open=state.packing.filter(x=>!x.done).length;
 const visible=state.packing.filter(x=>packView==='all'||(packView==='done'?x.done:!x.done));
 return title('Listen','Einkäufe und Ausrüstung an einem Ort')+sectionTabs('lists')+`<div class="stack">
 <div class="card"><div class="section-line"><div><h3>Packliste</h3><div class="small muted">${open} offen · ${state.packing.length-open} erledigt</div></div></div>
 <div class="filter-bar" role="group" aria-label="Packliste filtern">
 <button type="button" data-filter="pack:open" class="${packView==='open'?'active':''}">Offen</button>
 <button type="button" data-filter="pack:done" class="${packView==='done'?'active':''}">Gepackt</button>
 <button type="button" data-filter="pack:all" class="${packView==='all'?'active':''}">Alle</button></div>
 ${visible.length?visible.map(x=>`<div class="list-row">
 <input class="check" aria-label="${esc(x.title)} gepackt" type="checkbox" data-check="pack" data-id="${esc(x.id)}" ${x.done?'checked':''}>
 <div class="grow"><div class="item-title ${x.done?'done':''}">${esc(x.title)}</div><div class="small muted">${esc(x.category)} · ${esc(mname(x.owner))}</div></div>
 <button class="ghost mini" type="button" data-delete="pack" data-id="${esc(x.id)}">Löschen</button></div>`).join(''):empty('',state.packing.length?'Hier ist gerade alles erledigt.':'Noch keine Sachen eingetragen.')}
 </div>
 <details class="details-panel"><summary>Zur Packliste hinzufügen</summary>
 <form id="packForm" class="form-grid">
 <div class="field wide"><label>Gegenstand</label><input name="title" maxlength="100" required placeholder="z. B. Zelt, Regenjacke"></div>
 <div class="field"><label>Kategorie</label><select name="category"><option>Camping</option><option>Kleidung</option><option>Verpflegung</option><option>Technik</option><option>Hygiene</option><option>Sonstiges</option></select></div>
 <div class="field"><label>Wer bringt es mit?</label><select name="owner">${opts()}</select></div>
 <div class="btn-row"><button class="action">Hinzufügen</button></div></form>
 </details></div>`;
}

const ledgerStats=()=>{let fund=0,balances={};state.festival.members.forEach(m=>balances[m.id]=0);for(let x of state.ledger){if(x.type==='deposit')fund+=n(x.amount);else if(x.type==='expense'&&x.mode==='fund')fund-=n(x.amount);else if(x.type==='expense'){const people=(x.participants||[]).filter(id=>Object.hasOwn(balances,id));if(!people.length)continue;balances[x.payer]=(balances[x.payer]||0)+n(x.amount);for(let id of people)balances[id]-=n(x.amount)/people.length;}else if(x.type==='settlement'){balances[x.from]=(balances[x.from]||0)+n(x.amount);balances[x.to]=(balances[x.to]||0)-n(x.amount);}}return {fund,balances};};
function suggestTransfers(balances){
 const pos=Object.entries(balances).filter(([,x])=>x>0.009).map(([id,v])=>({id,c:Math.round(v*100)})).sort((a,b)=>b.c-a.c);
 const neg=Object.entries(balances).filter(([,x])=>x<-.009).map(([id,v])=>({id,c:Math.round(-v*100)})).sort((a,b)=>b.c-a.c);
 let out=[],i=0,j=0;
 while(i<neg.length&&j<pos.length){const cents=Math.min(neg[i].c,pos[j].c);if(cents>0)out.push({from:neg[i].id,to:pos[j].id,amount:cents/100});neg[i].c-=cents;pos[j].c-=cents;if(!neg[i].c)i++;if(!pos[j].c)j++;}
 return out;
}
function money(){
 const stats=ledgerStats();
 const spent=state.ledger.filter(x=>x.type==='expense').reduce((sum,x)=>sum+n(x.amount),0);
 const rec=state.receipts,transfers=suggestTransfers(stats.balances),kind=moneyEditor;
 const labels={expense:'Ausgabe eintragen',deposit:'Einzahlung',settlement:'Ausgleich'};
 const entry=kind?`<div class="card"><div class="row between"><h3>${labels[kind]}</h3><button class="ghost mini" type="button" data-money-action="close">Schließen ×</button></div>
 <form id="moneyForm" class="form-grid">
 <input type="hidden" name="type" id="moneyType" value="${esc(kind)}">
 <div class="field wide"><label>Wofür?</label><input name="title" required maxlength="100" value="${kind==='deposit'?'Einzahlung':kind==='settlement'?'Schuldenausgleich':''}" placeholder="z. B. Getränke, Einkaufen, Einzahlung"></div>
 <div class="field"><label>Betrag (€)</label><input name="amount" type="number" step="0.01" min="0.01" required placeholder="0,00"></div>
 <div class="field"><label>${kind==='deposit'?'Wer zahlt ein?':kind==='settlement'?'Wer überweist?':'Wer hat bezahlt?'}</label><select name="payer" id="moneyPayer">${opts()}</select></div>
 <div class="field wide" id="modeField"><label>Wie soll abgerechnet werden?</label><select name="mode" id="moneyMode"><option value="split">Unter ausgewählten Freunden aufteilen</option><option value="fund">Aus gemeinsamer Festivalkasse</option></select></div>
 <div class="field wide" id="participantsField"><label>Wer beteiligt sich?</label><div class="row wrap">${allchecks()}</div></div>
 <div class="field wide" id="toField"><label>Wer bekommt das Geld?</label><select name="to">${opts(state.festival.members[1]?.id||'me')}</select></div>

function collectReceiptRows(){

 const unitPrice=n(row.querySelector('[name="recPrice"]')?.value);
 const matchId=row.querySelector('[name="recMatch"]')?.value||'new';

 }).filter(x=>x.title&&x.qty>0&&x.unitPrice>=0);
}
function renderReceiptItems(){

 let options=`<option value="new" ${id==='new'?'selected':''}>Als gekauft hinzufügen</option><option value="ignore" ${id==='ignore'?'selected':''}>Nur auf dem Bon speichern</option>`+

function refreshReceiptTotal(){
 let node=$('#receiptSumCheck');if(!node)return;
 const rows=collectReceiptRows();
 if(!rows.length){node.textContent='';return;}
 const sum=n(rows.reduce((a,x)=>a+x.qty*x.unitPrice,0));
 const bon=n($('#receiptForm [name="amount"]')?.value);
 const diff=n(bon-sum);
 node.textContent='Erfasste Artikel: '+rows.length+' · zusammen '+eur(sum)+(bon>0&&Math.abs(diff)>.10?' · ⚠️ Unterschied zum Bon: '+eur(Math.abs(diff))+' (z. B. Pfand, Rabatt oder Erkennungsfehler)':'');
 node.classList.toggle('receipt-total-check',bon>0&&Math.abs(diff)>.10);
}

function participants(form){return [...form.querySelectorAll('input[name="participants"]:checked')].map(x=>x.value)}
function field(f,k){return new FormData(f).get(k)?.toString().trim()||''}
function download(file,content,mime){let b=new Blob([content],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let scannedFile=null,scannedData='',scannedItems=[];
async function shrink(file){return await new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let im=new Image;im.onload=()=>{let c=document.createElement('canvas'),sc=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};im.onerror=reject;im.src=r.result};r.readAsDataURL(file)})}
function loadOcr(){return new Promise((res,rej)=>{if(window.Tesseract)return res();let e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js';e.onload=res;e.onerror=()=>rej(Error('Die Texterkennung konnte nicht geladen werden.'));document.head.appendChild(e);})}
function moneyFromText(s){let lines=s.split(/\n/).map(t=>t.trim());let re=/(?:summe|gesamt|total|betrag|zu zahlen|endbetrag)/i, num=/(-?\d{1,5}[,.]\d{2})/g;let candidate=[];lines.forEach((t,i)=>{if(re.test(t)){let found=[...t.matchAll(num)];if(found.length)candidate.push(found.at(-1)[1]);else if(lines[i+1]){let found2=[...lines[i+1].matchAll(num)];if(found2.length)candidate.push(found2.at(-1)[1]);}}});return candidate.at(-1)||''}
function toast(msg){notice=msg;let node=document.createElement('div');node.textContent=msg;node.style='position:fixed;z-index:100;bottom:85px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:12px;background:#30323e;color:white;box-shadow:0 10px 30px #0008;max-width:85vw;text-align:center';document.body.append(node);setTimeout(()=>node.remove(),3200)}
document.addEventListener('click',async(e)=>{let el=e.target.closest('[data-tab],[data-modal],[data-close],[data-delete],[data-view-receipt],[data-money-action],[data-remove-receipt-item],[data-filter],#addReceiptItem,#settingsBtn,#exportBtn,#resetBtn,#ocrBtn');if(!el)return;
if(el.dataset.tab){active=el.dataset.tab;render();window.scrollTo(0,0)}
 else if(el.dataset.filter){const [area,mode]=el.dataset.filter.split(':');if(area==='shop')listView=mode;else if(area==='pack')packView=mode;render()}
else if(el.dataset.moneyAction){moneyEditor=el.dataset.moneyAction==='close'?'':el.dataset.moneyAction;active='money';render()}

else if(el.dataset.close||e.target.id==='dialog')close();
else if(el.id==='settingsBtn')modal('settings');
else if(el.dataset.delete){const ty=el.dataset.delete;const msg=ty==='receipt'?'Bon löschen? Die zugehörige Kassenbuchung wird ebenfalls entfernt. Gekaufte Artikel in der Einkaufsliste bleiben erhalten.':'Diesen Eintrag wirklich löschen?';if(!confirm(msg))return;const map={shop:'shopping',pack:'packing',lineup:'timeline',ledger:'ledger',receipt:'receipts'};if(ty==='receipt')state.ledger=state.ledger.filter(x=>x.receiptId!==el.dataset.id);state[map[ty]]=state[map[ty]].filter(x=>x.id!==el.dataset.id);save();render()}
else if(el.dataset.viewReceipt){let rec=state.receipts.find(x=>x.id===el.dataset.viewReceipt);if(rec)dialog(receiptDetails(rec))}
else if(el.id==='exportBtn'){download('FestivalCrew-Sicherung.json',JSON.stringify(state,null,2),'application/json');toast('Sicherung heruntergeladen')}
else if(el.id==='resetBtn'){if(confirm('Alle lokal gespeicherten Daten dieser Demo unwiderruflich löschen?')){state=fresh();save();close();active='home';render()}}
else if(el.id==='ocrBtn'){
 const status=$('#ocrStatus');
 if(!scannedFile){status.textContent='Bitte zuerst einen Kassenbon fotografieren.';return}
 el.disabled=true;status.textContent='Artikel werden auf deinem Gerät gelesen…';
 try{
  await loadOcr();if(!window.Tesseract)throw Error('Bibliothek nicht verfügbar');
  let result=await window.Tesseract.recognize(scannedFile,'deu');
  let parsed=window.FestivalReceipt.parse(result.data.text||'');
  scannedItems=parsed.items.map(x=>({...x,matchId:window.FestivalReceipt.bestMatch(x.title,state.shopping)||'new'}));
  let form=$('#receiptForm');
  if(parsed.total!==null)form.elements.amount.value=parsed.total;
  if(parsed.store&&!form.elements.shop.value.trim())form.elements.shop.value=parsed.store;
  if(parsed.date)form.elements.date.value=parsed.date;
  renderReceiptItems();
  status.textContent=scannedItems.length+' Artikelposition(en) vorgeschlagen. Prüfe die Namen, Mengen und Preise und wähle die passende Einkaufsliste-Zuordnung.'+(parsed.total===null?' Gesamtbetrag bitte eintragen.':'');
 }catch(ex){console.error(ex);status.textContent='Texterkennung fehlgeschlagen. Du kannst alle Artikel und den Betrag manuell eintragen.'}
 finally{el.disabled=false}
}
});

document.addEventListener('submit',e=>{let f=e.target;if(!f.id)return;e.preventDefault();let id=f.id,now=new Date().toISOString();try{if(id==='shopForm'){if(n(field(f,'qty'))<=0)return;state.shopping.push({id:uuid(),title:field(f,'title'),qty:n(field(f,'qty')),unit:field(f,'unit'),price:n(field(f,'price')),owner:field(f,'owner'),bought:false})}
else if(id==='packForm'){state.packing.push({id:uuid(),title:field(f,'title'),category:field(f,'category'),owner:field(f,'owner'),done:false})}
else if(id==='moneyForm'){let type=field(f,'type'),amount=n(field(f,'amount')),mode=field(f,'mode'),payer=field(f,'payer'),to=field(f,'to'),people=participants(f);if(amount<=0){alert('Der Betrag muss positiv sein.');return}if(type==='expense'&&mode==='split'&&!people.length){alert('Bitte mindestens eine beteiligte Person auswählen.');return}if(type==='settlement'&&payer===to){alert('Bitte zwei verschiedene Personen auswählen.');return}state.ledger.push({id:uuid(),type,amount,title:field(f,'title'),payer,from:payer,to,mode,participants:people,created:now})}
else if(id==='lineupForm'){let start=field(f,'start'),end=field(f,'end');if(end<=start){alert('Das Ende muss nach dem Beginn liegen.');return}state.timeline.push({id:uuid(),band:field(f,'band'),stage:field(f,'stage'),start,end,participants:participants(f)})}
else if(id==='chatForm'){state.chat.push({id:uuid(),message:field(f,'message'),sender:'me',created:now})}
else if(id==='memberForm'){state.festival.members.push({id:uuid(),name:field(f,'name')});close()}
else if(id==='festivalForm'){state.festival.name=field(f,'name');state.festival.date=field(f,'date');close()}
else if(id==='receiptForm'){
 const amount=n(field(f,'amount')),shop=field(f,'shop'),rid=uuid(),mode=field(f,'mode'),payer=field(f,'payer'),people=participants(f);
 if(amount<0||!shop){alert('Bitte Geschäft und gültigen Betrag eintragen.');return}
 if(mode==='split'&&!people.length){alert('Bitte mindestens eine Person zum Aufteilen wählen.');return}
 const items=collectReceiptRows();
 state.receipts.push({id:rid,shop,date:field(f,'date'),amount,image:scannedData,items});
 if(mode!=='none'&&amount>0)state.ledger.push({id:uuid(),type:'expense',title:'Kassenbon: '+shop,amount,mode,payer,participants:mode==='split'?people:[],receiptId:rid,created:now});
 for(let item of items){
  if(item.matchId==='ignore')continue;
  let existing=state.shopping.find(x=>x.id===item.matchId);
  if(existing){
   let oldQty=existing.bought?n(existing.qty):n(existing.boughtQty||0);
   existing.boughtQty=Math.min(n(existing.qty),n(oldQty+item.qty));
   existing.bought=existing.boughtQty>=n(existing.qty)-0.001;
   existing.price=item.unitPrice;
  }else{
   state.shopping.push({id:uuid(),title:item.title,qty:item.qty,unit:'Stück',price:item.unitPrice,owner:payer,bought:true,boughtQty:item.qty,receiptId:rid});
  }
 }
 close();scannedFile=null;scannedData='';scannedItems=[];
}
else return;if(id==='moneyForm')moneyEditor='';if(save()){if(id==='receiptForm'){active='shop';listView='bought'}if(id==='shopForm'){active='shop';listView='open'}if(id==='packForm'){active='pack';packView='open'}render();toast(id==='receiptForm'?'Bon, Artikel und Kasse gespeichert':'Gespeichert')}}catch(err){console.error(err);alert('Konnte den Eintrag nicht speichern.')}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))close()});
render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
