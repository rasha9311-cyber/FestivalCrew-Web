<html lang="de">
<head>

<title>FestivalCrew – Festivalplanung</title>
<style>
:root{color-scheme:dark;--bg:#0c0d11;--surface:#17191f;--raised:#20232c;--line:#343743;--ink:#f3f4f7;--muted:#9fa2ae;--accent:#ec445b;--good:#70d3ab;--warn:#ffd284;--shadow:0 16px 50px #0007;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#481827 0%,transparent 36%),var(--bg);color:var(--ink);min-height:100dvh;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}.app{max-width:1120px;margin:0 auto;min-height:100dvh}.header{display:flex;align-items:center;gap:14px;padding:23px 23px 12px}.mark{width:51px;height:51px;display:grid;place-items:center;background:linear-gradient(135deg,#f64661,#88273b);font-size:28px;border-radius:15px;box-shadow:0 8px 24px #ef445b47}.headline{flex:1;min-width:0}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:#f28a9b}.headline h1{margin:3px 0 0;font-size:24px;letter-spacing:-.8px}.icon-button{height:40px;width:40px;border:1px solid var(--line);background:#26212a;color:var(--ink);border-radius:12px;font-size:19px}.festival{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 23px 19px;padding:16px 19px;background:linear-gradient(115deg,#3e1722,#251b25);border:1px solid #713344;border-radius:18px}.festival h2{font-size:18px;margin:0 0 4px}.festival p{color:#d4b1b9;font-size:12px;margin:0}.pill{font-size:11px;border-radius:30px;border:1px solid #965260;background:#512430;color:#ffbfca;padding:7px 10px;white-space:nowrap}.nav{display:flex;gap:9px;padding:0 23px 15px;overflow:auto}.nav button{border:1px solid var(--line);background:#17191fe8;padding:11px 15px;border-radius:12px;color:#aaaeba;white-space:nowrap;font-size:13px;font-weight:750}.nav button.active{border-color:#e64964;color:#fff;background:#8a263b}.content{padding:0 23px 100px}.page-title{display:flex;gap:14px;justify-content:space-between;align-items:flex-end;margin:12px 0 15px}.page-title h2{font-size:22px;letter-spacing:-.5px;margin:0}.page-title p{margin:5px 0 0;color:var(--muted);font-size:13px}.stack{display:grid;gap:13px}.card{background:#181a21eb;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 4px 25px #0002}.card h3{font-size:16px;margin:0 0 12px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric{background:#1c1d25;border:1px solid #32343f;border-radius:15px;padding:15px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.metric b{font-size:20px;letter-spacing:-.3px}.metric b.red{color:#f87889}.metric b.green{color:var(--good)}.row{display:flex;gap:9px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.tag{font-size:11px;color:#c5c6d0;border:1px solid #454650;padding:4px 8px;border-radius:20px}.action{border:none;background:var(--accent);color:white;border-radius:11px;padding:11px 15px;font-weight:800}.secondary{background:#30313c;border:1px solid #494b57;color:#f4f4f5}.ghost{border:1px solid #444650;background:transparent;color:#bfc2cc;border-radius:11px;padding:8px 10px}.danger{border:1px solid #844254;background:#451c29;color:#ffb2bf;border-radius:11px;padding:8px 11px}.mini{font-size:12px;padding:8px 11px}.list-row{display:flex;gap:11px;align-items:center;border-top:1px solid #31333d;padding:12px 0}.list-row:first-child{border-top:0;padding-top:0}.list-row:last-child{padding-bottom:0}.check{accent-color:var(--accent);height:19px;width:19px}.item-title{font-weight:750}.done{text-decoration:line-through;color:#868a98}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:grid;gap:6px}.field.wide{grid-column:1/-1}.field label{color:#d0d1d9;font-size:12px;font-weight:700}.field input,.field select,.field textarea{background:#0f1117;border:1px solid #484b57;border-radius:10px;color:#fafafa;width:100%;padding:11px 12px;min-width:0;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#fa617b}.field textarea{resize:vertical;min-height:72px}.field input::placeholder{color:#6d7280}.btn-row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}.member-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #474954;border-radius:12px;padding:6px 9px;background:#22242d;font-size:12px}.member-chip input{accent-color:var(--accent)}.empty{text-align:center;padding:38px 14px;color:var(--muted)}.empty .emoji{font-size:42px;margin-bottom:6px}.notice{border:1px solid #625241;background:#2a241d;color:#ead5bd;border-radius:12px;padding:12px;font-size:12px;line-height:1.5}.success{color:var(--good)}.avatar{height:35px;width:35px;flex:0 0 35px;border-radius:50%;background:#77283c;display:grid;place-items:center;font-size:14px;font-weight:800}.chat-window{height:min(45dvh,390px);overflow:auto;border-radius:12px;background:#111219;padding:14px;display:flex;flex-direction:column;gap:11px}.bubble{align-self:flex-start;max-width:85%;padding:10px 12px;border-radius:13px;background:#282a35}.bubble.me{align-self:flex-end;background:#672638}.bubble small{display:block;font-size:10px;color:#ceafbc;margin-bottom:4px}.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.bottom-nav{display:none}.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;background:#612838;color:#ff9cad;min-width:24px;padding:4px 6px;font-weight:800;font-size:11px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:#b0b2bf;font-weight:800;margin:2px 0 0}.footer{color:#737786;font-size:11px;text-align:center;padding:0 20px 29px}.modal-bg{position:fixed;inset:0;z-index:40;background:#050508c9;display:flex;align-items:center;justify-content:center;padding:18px}.modal{max-width:540px;width:100%;max-height:94dvh;overflow:auto;border-radius:18px;background:#1d1f27;border:1px solid #4a4b55;padding:22px;box-shadow:var(--shadow)}.modal h2{margin:0 0 17px}.show{display:block}.hidden{display:none!important}.receipt-preview{max-height:170px;max-width:100%;object-fit:contain;border-radius:9px}.split-overlap{color:#ffcf8a;font-size:11px}.hint{font-size:12px;color:#adb0bd;line-height:1.5}.tab-panel{display:none}.tab-panel.active{display:block}hr{border:0;border-top:1px solid #383943;margin:15px 0}select option{background:#17191f}input[type=file]{padding:8px}.column{display:grid;gap:10px}.right{text-align:right}
@media(min-width:780px){.stack.two{grid-template-columns:1.1fr .9fr}.summary{gap:14px}.metric b{font-size:25px}.card{padding:20px}.headline h1{font-size:27px}}
@media(max-width:720px){.header{padding:17px 16px 8px}.headline h1{font-size:22px}.festival{margin:10px 15px 16px;padding:14px}.nav{display:none}.content{padding:0 15px 110px}.bottom-nav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;z-index:15;background:#17191ff2;backdrop-filter:blur(15px);border-top:1px solid #45454d;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{display:grid;gap:4px;justify-items:center;align-items:center;border:none;background:none;color:#9296a3;font-size:10px;min-width:0}.bottom-nav button .ico{font-size:19px}.bottom-nav button.active{color:#ff7188}.metric{padding:11px}.metric b{font-size:16px}.metric small{font-size:10px}.page-title h2{font-size:20px}.row.mobile-wrap{flex-wrap:wrap}.footer{padding-bottom:90px}}
@media(max-width:350px){.bottom-nav button{font-size:8px}.bottom-nav button .ico{font-size:16px}.metric b{font-size:14px}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="mark">🤘</div><div class="headline"><div class="eyebrow">DEIN FESTIVAL. DEINE CREW.</div><h1>FestivalCrew</h1></div><button class="icon-button" id="settingsBtn" aria-label="Einstellungen">☰</button></header>
<section class="festival"><div><h2 id="festivalName">Wacken – Crew</h2><p id="festivalInfo">Gemeinsam planen. Zusammen feiern.</p></div><span class="pill">🎸 Festivalmodus</span></section>
<nav class="nav" id="desktopNav"></nav><main class="content" id="main"></main>
<footer class="footer">FestivalCrew 0.1.0 · Handy-Prototyp · Kein offizielles Wacken-Angebot</footer>
<nav class="bottom-nav" id="mobileNav"></nav></div>
<div id="dialog" class="hidden"></div>
<script>
(()=>{'use strict';
const KEY='festivalcrew-prototype-0.1.0';
const tabs=[['home','👥','Gruppe'],['shop','🛒','Einkaufen'],['money','💰','Kasse'],['pack','🎒','Packen'],['lineup','🎸','Timeline'],['chat','💬','Chat']];
const uuid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fresh=()=>({festival:{name:'Wacken – unsere Crew',date:'',members:[{id:'me',name:'Ich'},{id:'crew1',name:'Mitglied 2'},{id:'crew2',name:'Mitglied 3'}]},shopping:[],packing:[],ledger:[],timeline:[],chat:[],receipts:[]});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()};
const $=x=>document.querySelector(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const n=v=>Math.round((Number(String(v??0).replace(',','.'))||0)*100)/100;
const mname=id=>state.festival.members.find(m=>m.id===id)?.name||'Unbekannt';
const opts=(chosen='me')=>state.festival.members.map(m=>`<option value="${esc(m.id)}" ${chosen===m.id?'selected':''}>${esc(m.name)}</option>`).join('');
const allchecks=()=>state.festival.members.map(m=>`<label class="member-chip"><input type="checkbox" name="participants" value="${esc(m.id)}" checked> ${esc(m.name)}</label>`).join('');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Lokaler Speicher ist voll. Bitte ältere Kassenbonbilder löschen oder Daten exportieren.');return false}};
let active='home';let notice='';
const navbar=()=>tabs.map(t=>`<button type="button" data-tab="${t[0]}" class="${active===t[0]?'active':''}"><span class="ico">${t[1]}</span><span>${t[2]}</span></button>`).join('');
const title=(s,info)=>`<div class="page-title"><div><h2>${s}</h2><p>${info}</p></div></div>`;
const empty=(emoji,txt)=>`<div class="empty"><div class="emoji">${emoji}</div><p>${txt}</p></div>`;
const memberOptions=id=>opts(id);
const summary=()=>{let bought=state.shopping.filter(x=>x.bought).length,packed=state.packing.filter(x=>x.done).length;return `<div class="summary"><div class="metric"><small>Erledigte Einkäufe</small><b>${bought} / ${state.shopping.length}</b></div><div class="metric"><small>Gepackt</small><b>${packed} / ${state.packing.length}</b></div><div class="metric"><small>Bandtermine</small><b class="red">${state.timeline.length}</b></div></div>`};
function home(){let d=state.festival;return title('Eure Festivalgruppe','Alle Vorbereitungen an einem Ort')+`<div class="stack"><div class="card"><div class="row between"><h3>🤘 ${esc(d.name)}</h3><span class="badge">${d.members.length} Leute</span></div><div class="column">${d.members.map(x=>`<div class="row"><span class="avatar">${esc(x.name.slice(0,1).toUpperCase())}</span><b>${esc(x.name)}</b>${x.id==='me'?'<span class="tag">Du</span>':''}</div>`).join('')}</div><hr><div class="row mobile-wrap"><button class="action secondary" data-modal="member">+ Mitglied hinzufügen</button><button class="ghost" data-modal="festival">Festival bearbeiten</button></div></div>${summary()}<div class="card"><h3>🧭 Schnellzugriff</h3><div class="row wrap"><button class="action" data-tab="shop">🛒 Einkäufe</button><button class="action secondary" data-tab="money">💰 Gruppenkasse</button><button class="action secondary" data-tab="lineup">🎸 Timeline</button></div></div><div class="notice">Diese Version speichert Daten nur auf deinem Handy. Mitgliederliste und Chat sind zurzeit eine lokale Demo; andere Personen sehen Änderungen noch nicht. Sichere Cloud-Synchronisierung folgt in einem späteren Schritt.</div></div>`;}
function shop(){let total=state.shopping.reduce((a,x)=>a+n(x.price)*n(x.qty),0);return title('Einkaufsliste','Zuständigkeiten, Mengen und Preise')+`<div class="stack two"><div class="stack"><div class="summary"><div class="metric"><small>Artikel</small><b>${state.shopping.length}</b></div><div class="metric"><small>Gekauft</small><b class="green">${state.shopping.filter(x=>x.bought).length}</b></div><div class="metric"><small>Geplant</small><b>${eur(total)}</b></div></div><div class="card"><h3>🛒 Gemeinsame Liste</h3>${state.shopping.length?state.shopping.map(x=>`<div class="list-row"><input class="check" type="checkbox" data-check="shop" data-id="${x.id}" ${x.bought?'checked':''}><div class="grow"><div class="item-title ${x.bought?'done':''}">${esc(x.title)}</div><div class="small muted">${esc(x.qty)} × ${esc(x.unit)} · ${esc(mname(x.owner))}</div></div><div class="right"><b>${eur(n(x.price)*n(x.qty))}</b><div><button class="ghost mini" data-delete="shop" data-id="${x.id}">Löschen</button></div></div></div>`).join(''):empty('🛍️','Eure Liste ist noch leer.')}</div></div><div class="card"><h3>+ Artikel hinzufügen</h3><form id="shopForm" class="form-grid"><div class="field wide"><label>Artikel</label><input name="title" required maxlength="100" placeholder="z. B. Wasser, Grillfleisch, Pavillon"></div><div class="field"><label>Menge</label><input name="qty" type="number" min="0.1" step="0.1" value="1" required></div><div class="field"><label>Einheit</label><select name="unit"><option>Stück</option><option>Kiste</option><option>Packung</option><option>Flasche</option><option>kg</option><option>Liter</option></select></div><div class="field"><label>Preis pro Einheit (€)</label><input name="price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Wer besorgt's?</label><select name="owner">${opts()}</select></div><div class="btn-row"><button class="action">Eintragen</button></div></form></div></div>`;}
function pack(){return title('Packliste','Was muss unbedingt mit?')+`<div class="stack two"><div class="card"><h3>🎒 Alles im Blick</h3>${state.packing.length?state.packing.map(x=>`<div class="list-row"><input class="check" type="checkbox" data-check="pack" data-id="${x.id}" ${x.done?'checked':''}><div class="grow"><div class="item-title ${x.done?'done':''}">${esc(x.title)}</div><div class="small muted">${esc(x.category)} · ${esc(mname(x.owner))}</div></div><button class="ghost mini" data-delete="pack" data-id="${x.id}">Löschen</button></div>`).join(''):empty('⛺','Noch keine Sachen eingetragen.')}</div><div class="card"><h3>+ Zur Liste</h3><form id="packForm" class="form-grid"><div class="field wide"><label>Was soll mit?</label><input name="title" maxlength="100" required placeholder="z. B. Zelt, Gaskocher, Regenjacke"></div><div class="field"><label>Kategorie</label><select name="category"><option>Camping</option><option>Kleidung</option><option>Verpflegung</option><option>Technik</option><option>Hygiene</option><option>Sonstiges</option></select></div><div class="field"><label>Wer kümmert sich?</label><select name="owner">${opts()}</select></div><div class="btn-row"><button class="action">Hinzufügen</button></div></form></div></div>`;}
const ledgerStats=()=>{let fund=0,balances={};state.festival.members.forEach(m=>balances[m.id]=0);for(let x of state.ledger){if(x.type==='deposit')fund+=n(x.amount);else if(x.type==='expense'&&x.mode==='fund')fund-=n(x.amount);else if(x.type==='expense'){const people=(x.participants||[]).filter(id=>Object.hasOwn(balances,id));if(!people.length)continue;balances[x.payer]=(balances[x.payer]||0)+n(x.amount);for(let id of people)balances[id]-=n(x.amount)/people.length;}else if(x.type==='settlement'){balances[x.from]=(balances[x.from]||0)+n(x.amount);balances[x.to]=(balances[x.to]||0)-n(x.amount);}}return {fund,balances};};
function money(){let stats=ledgerStats();let spent=state.ledger.filter(x=>x.type==='expense').reduce((s,x)=>s+n(x.amount),0);let rec=state.receipts;return title('Gruppenkasse','Gemeinsame Kasse und faire Aufteilung')+`<div class="stack"><div class="summary"><div class="metric"><small>Festivalkasse</small><b class="${stats.fund>=0?'green':'red'}">${eur(stats.fund)}</b></div><div class="metric"><small>Ausgaben gesamt</small><b>${eur(spent)}</b></div><div class="metric"><small>Kassenbons</small><b>${rec.length}</b></div></div><div class="stack two"><div class="card"><h3>💳 Buchung erfassen</h3><form id="moneyForm" class="form-grid"><div class="field wide"><label>Buchungsart</label><select name="type" id="moneyType"><option value="expense">Ausgabe</option><option value="deposit">Einzahlung in die Festivalkasse</option><option value="settlement">Schuldenausgleich</option></select></div><div class="field wide"><label>Beschreibung</label><input name="title" required maxlength="100" placeholder="z. B. Getränke für die Gruppe"></div><div class="field"><label>Betrag (€)</label><input name="amount" min="0.01" step="0.01" type="number" required placeholder="0,00"></div><div class="field"><label>Bezahlt von / eingezahlt von</label><select name="payer" id="moneyPayer">${opts()}</select></div><div class="field wide" id="modeField"><label>Abrechnung</label><select name="mode" id="moneyMode"><option value="split">Auf bestimmte Personen aufteilen</option><option value="fund">Aus gemeinsamer Festivalkasse</option></select></div><div class="field wide" id="participantsField"><label>Wer beteiligt sich an dieser Ausgabe?</label><div class="row wrap">${allchecks()}</div></div><div class="field wide hidden" id="toField"><label>Ausgleich geht an</label><select name="to">${opts(state.festival.members[1]?.id||'me')}</select></div><div class="btn-row"><button class="action">Buchung speichern</button><button type="button" class="action secondary" data-modal="receipt">📷 Kassenbon scannen</button></div></form><div class="hint" style="margin-top:12px">Beim Aufteilen wird berechnet, wer wem etwas schuldet. Einkäufe aus der Festivalkasse reduzieren nur das gemeinsame Guthaben.</div></div><div class="card"><h3>⚖️ Wer steht wie?</h3>${Object.entries(stats.balances).map(([id,v])=>`<div class="list-row"><div class="grow"><b>${esc(mname(id))}</b><div class="small muted">${Math.abs(v)<0.005?'Ausgeglichen':v>0?'Hat Geld vorgestreckt':'Hat noch einen Anteil offen'}</div></div><b class="${v>0?'success':v<0?'red':''}">${eur(v)}</b></div>`).join('')}<hr><h3>🧾 Gespeicherte Kassenbons</h3>${rec.length?rec.slice().reverse().map(x=>`<div class="list-row"><div class="grow"><b>${esc(x.shop)}</b><div class="small muted">${eur(x.amount)} · ${esc(x.date)}</div></div>${x.image?`<button class="ghost mini" data-view-receipt="${x.id}">Ansehen</button>`:''}<button class="ghost mini" data-delete="receipt" data-id="${x.id}">×</button></div>`).join(''):empty('📃','Noch kein Kassenbon erfasst.')}</div></div><div class="card"><h3>📒 Buchungshistorie</h3>${state.ledger.length?state.ledger.slice().reverse().map(x=>`<div class="list-row"><div class="grow"><b>${esc(x.title)}</b><div class="small muted">${x.type==='deposit'?'Einzahlung':x.type==='settlement'?'Ausgleich':x.mode==='fund'?'Festivalkasse':'Aufgeteilt'} · ${esc(mname(x.payer||x.from))} · ${new Date(x.created).toLocaleDateString('de-DE')}</div></div><b>${eur(x.amount)}</b><button class="ghost mini" data-delete="ledger" data-id="${x.id}">×</button></div>`).join(''):empty('💶','Noch keine Buchungen.')}</div></div>`;}
const tval=x=>x?.replace('T',' ')||'';
function lineup(){const sorted=[...state.timeline].sort((a,b)=>(a.start||'').localeCompare(b.start||''));return title('Festival-Timeline','Zusammen zu euren Lieblingsbands')+`<div class="stack two"><div class="card"><h3>🎤 Konzertplan</h3>${sorted.length?sorted.map(x=>{const overlaps=sorted.filter(y=>y.id!==x.id&&y.start&&x.start&&y.start<x.end&&x.start<y.end);return `<div class="list-row"><div class="grow"><div class="item-title">${esc(x.band)}</div><div class="small muted">${esc(tval(x.start))} – ${esc((x.end||'').slice(11))} · ${esc(x.stage||'Bühne offen')}</div><div class="small">👥 ${esc((x.participants||[]).map(mname).join(', ')||'Niemand')}</div>${overlaps.length?`<div class="split-overlap">⚠️ Überschneidung mit ${esc(overlaps.map(y=>y.band).join(', '))}</div>`:''}</div><button class="ghost mini" data-delete="lineup" data-id="${x.id}">×</button></div>`}).join(''):empty('🎸','Füge eure ersten Bands hinzu.')}</div><div class="card"><h3>+ Band einplanen</h3><form id="lineupForm" class="form-grid"><div class="field wide"><label>Band / Auftritt</label><input name="band" maxlength="90" required placeholder="Bandname"></div><div class="field"><label>Beginn</label><input type="datetime-local" name="start" required></div><div class="field"><label>Ende</label><input type="datetime-local" name="end" required></div><div class="field wide"><label>Bühne</label><input name="stage" maxlength="80" placeholder="z. B. Faster Stage"></div><div class="field wide"><label>Wer möchte mit?</label><div class="row wrap">${allchecks()}</div></div><div class="btn-row"><button class="action">Zur Timeline</button></div></form><p class="hint">Bandtermine werden hier manuell eingetragen. Es besteht noch keine Verbindung zur offiziellen Wacken-Running-Order.</p></div></div>`;}
function chat(){return title('Gruppenchat','Absprachen, Ideen und Treffpunkte')+`<div class="stack"><div class="notice">💬 <b>Demomodus:</b> Nachrichten werden nur auf diesem Gerät gespeichert. Für einen echten Gruppenchat brauchen wir später Benutzerkonten und Echtzeit-Synchronisierung.</div><div class="card"><div class="chat-window" id="chatWindow">${state.chat.length?state.chat.map(x=>`<div class="bubble ${x.sender==='me'?'me':''}"><small>${esc(mname(x.sender))} · ${new Date(x.created).toLocaleString('de-DE',{dateStyle:'short',timeStyle:'short'})}</small><p>${esc(x.message)}</p></div>`).join(''):empty('💬','Hier beginnt euer Festivalchat.')}</div><form id="chatForm" class="row" style="margin-top:12px"><input name="message" required maxlength="1500" aria-label="Nachricht" placeholder="Nachricht schreiben…" style="flex:1;min-width:0;background:#101117;border:1px solid #454650;border-radius:10px;padding:12px;color:#fff"><button class="action">Senden</button></form></div></div>`;}
function render(){let d=state.festival;$('#festivalName').textContent=d.name;$('#festivalInfo').textContent=(d.date?new Date(d.date+'T12:00:00').toLocaleDateString('de-DE')+' · ':'')+d.members.length+' Mitglieder · Deine Planung';$('#desktopNav').innerHTML=navbar();$('#mobileNav').innerHTML=navbar();$('#main').innerHTML=({home,shop,money,pack,lineup,chat}[active]||home)();if(active==='money')toggleMoney();if(active==='chat'){let el=$('#chatWindow');el.scrollTop=el.scrollHeight;}}
function dialog(content){$('#dialog').className='modal-bg';$('#dialog').innerHTML=`<div class="modal" role="dialog" aria-modal="true">${content}</div>`;}
function close(){let el=$('#dialog');el.className='hidden';el.innerHTML='';}
function modal(type){if(type==='member'){dialog(`<div class="row between"><h2>👥 Mitglied hinzufügen</h2><button class="icon-button" data-close>×</button></div><form id="memberForm" class="column"><div class="field"><label>Name</label><input name="name" required maxlength="50" placeholder="Name der Person"></div><button class="action">Hinzufügen</button></form><p class="hint">Die Mitgliedernamen sind momentan nur auf diesem Gerät gespeichert.</p>`)}else if(type==='festival'){dialog(`<div class="row between"><h2>🎸 Festival bearbeiten</h2><button class="icon-button" data-close>×</button></div><form id="festivalForm" class="column"><div class="field"><label>Name</label><input name="name" required maxlength="100" value="${esc(state.festival.name)}"></div><div class="field"><label>Startdatum (optional)</label><input name="date" type="date" value="${esc(state.festival.date)}"></div><button class="action">Speichern</button></form>`)}else if(type==='settings'){dialog(`<div class="row between"><h2>⚙️ Einstellungen</h2><button class="icon-button" data-close>×</button></div><div class="column"><p>FestivalCrew Version 0.1.0</p><div class="notice">🔒 <b>Datenschutz dieser Demo:</b> Angaben und Fotos liegen ausschließlich im lokalen Gerätespeicher. Noch keine Cloud-Verbindung, keine automatische Sicherung und kein echter Gruppenchat.</div><button class="action secondary" id="exportBtn">⬇️ Daten als JSON sichern</button><label class="action secondary" style="text-align:center;cursor:pointer">⬆️ Sicherung importieren<input type="file" id="importInput" accept="application/json,.json" class="hidden"></label><button class="danger" id="resetBtn">Lokale Daten zurücksetzen</button></div>`)}else if(type==='receipt'){dialog(`<div class="row between"><h2>📷 Kassenbon-Scanner</h2><button class="icon-button" data-close>×</button></div><div class="notice">Die automatische Texterkennung nutzt bei Bedarf eine kostenlose Browserbibliothek. Bitte jeden erkannten Betrag überprüfen. Falls das nicht klappt, kannst du alles manuell eintragen.</div><form id="receiptForm" class="form-grid" style="margin-top:15px"><div class="field wide"><label>Kassenbon fotografieren oder Bild wählen</label><input id="receiptImage" name="image" type="file" accept="image/*" capture="environment"></div><div class="field wide"><div id="receiptThumb" class="row"></div><button type="button" class="action secondary" id="ocrBtn">🔎 Text vom Foto erkennen (online)</button><span class="hint" id="ocrStatus">Zum Scannen zuerst ein Foto auswählen.</span></div><div class="field wide"><label>Geschäft</label><input name="shop" required maxlength="120" placeholder="z. B. Supermarkt"></div><div class="field"><label>Gesamtbetrag (€)</label><input name="amount" required type="number" step="0.01" min="0" placeholder="0,00"></div><div class="field"><label>Datum</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field wide"><label>Buchung zuordnen</label><select name="mode"><option value="none">Nur Kassenbon archivieren</option><option value="fund">Aus gemeinsamer Festivalkasse</option><option value="split">Auf alle Gruppenmitglieder aufteilen</option></select></div><div class="field wide"><label>Bezahlt von</label><select name="payer">${opts()}</select></div><div class="btn-row"><button class="action">Bon speichern</button></div></form>`)} }
function toggleMoney(){let type=$('#moneyType')?.value, mode=$('#moneyMode')?.value;$('#modeField')?.classList.toggle('hidden',type!=='expense');$('#participantsField')?.classList.toggle('hidden',type!=='expense'||mode!=='split');$('#toField')?.classList.toggle('hidden',type!=='settlement');}
function participants(form){return [...form.querySelectorAll('input[name="participants"]:checked')].map(x=>x.value)}
function field(f,k){return new FormData(f).get(k)?.toString().trim()||''}
function download(file,content,mime){let b=new Blob([content],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let scannedFile=null,scannedData='';
async function shrink(file){return await new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=reject;r.onload=()=>{let im=new Image;im.onload=()=>{let c=document.createElement('canvas'),sc=Math.min(1,900/Math.max(im.width,im.height));c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.65))};im.onerror=reject;im.src=r.result};r.readAsDataURL(file)})}
function loadOcr(){return new Promise((res,rej)=>{if(window.Tesseract)return res();let e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js';e.onload=res;e.onerror=()=>rej(Error('Die Texterkennung konnte nicht geladen werden.'));document.head.appendChild(e);})}
function moneyFromText(s){let lines=s.split(/\n/).map(t=>t.trim());let re=/(?:summe|gesamt|total|betrag|zu zahlen|endbetrag)/i, num=/(-?\d{1,5}[,.]\d{2})/g;let candidate=[];lines.forEach((t,i)=>{if(re.test(t)){let found=[...t.matchAll(num)];if(found.length)candidate.push(found.at(-1)[1]);else if(lines[i+1]){let found2=[...lines[i+1].matchAll(num)];if(found2.length)candidate.push(found2.at(-1)[1]);}}});return candidate.at(-1)||''}
function toast(msg){notice=msg;let node=document.createElement('div');node.textContent=msg;node.style='position:fixed;z-index:100;bottom:85px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:12px;background:#30323e;color:white;box-shadow:0 10px 30px #0008;max-width:85vw;text-align:center';document.body.append(node);setTimeout(()=>node.remove(),3200)}
document.addEventListener('click',async(e)=>{let el=e.target.closest('[data-tab],[data-modal],[data-close],[data-delete],[data-view-receipt],#settingsBtn,#exportBtn,#resetBtn,#ocrBtn');if(!el)return;
if(el.dataset.tab){active=el.dataset.tab;render();window.scrollTo(0,0)}
else if(el.dataset.modal){scannedFile=null;scannedData='';modal(el.dataset.modal)}
else if(el.dataset.close||e.target.id==='dialog')close();
else if(el.id==='settingsBtn')modal('settings');
else if(el.dataset.delete){const ty=el.dataset.delete;if(!confirm('Diesen Eintrag wirklich löschen?'))return;const map={shop:'shopping',pack:'packing',lineup:'timeline',ledger:'ledger',receipt:'receipts'};state[map[ty]]=state[map[ty]].filter(x=>x.id!==el.dataset.id);save();render()}
else if(el.dataset.viewReceipt){let rec=state.receipts.find(x=>x.id===el.dataset.viewReceipt);if(rec&&rec.image)dialog(`<div class="row between"><h2>🧾 ${esc(rec.shop)}</h2><button class="icon-button" data-close>×</button></div><img alt="Kassenbon" style="width:100%;max-height:70dvh;object-fit:contain" src="${rec.image}"><p>${eur(rec.amount)}</p>`)}
else if(el.id==='exportBtn'){download('FestivalCrew-Sicherung.json',JSON.stringify(state,null,2),'application/json');toast('Sicherung heruntergeladen')}
else if(el.id==='resetBtn'){if(confirm('Alle lokal gespeicherten Daten dieser Demo unwiderruflich löschen?')){state=fresh();save();close();active='home';render()}}
else if(el.id==='ocrBtn'){let status=$('#ocrStatus');if(!scannedFile){status.textContent='Bitte zuerst einen Kassenbon fotografieren.';return}el.disabled=true;status.textContent='Sprachmodell wird geladen und Foto auf deinem Gerät ausgewertet…';try{await loadOcr();if(!window.Tesseract)throw Error('Bibliothek nicht verfügbar');let r=await window.Tesseract.recognize(scannedFile,'deu');let txt=r.data.text||'';let amount=moneyFromText(txt);let f=$('#receiptForm');if(amount)f.elements.amount.value=n(amount);status.textContent=amount?'Möglicher Gesamtbetrag erkannt: '+amount+' €. Bitte prüfen.':'Text gelesen, aber kein eindeutiger Gesamtbetrag erkannt. Bitte manuell eingeben.';}catch(ex){status.textContent='Automatische Erkennung nicht verfügbar. Bitte Betrag und Geschäft manuell eintragen.'}finally{el.disabled=false}}
});
document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.check){let map=el.dataset.check==='shop'?'shopping':'packing',prop=map==='shopping'?'bought':'done',x=state[map].find(v=>v.id===el.dataset.id);if(x){x[prop]=el.checked;save();render()}}if(el.id==='moneyType'||el.id==='moneyMode')toggleMoney();if(el.id==='receiptImage'){scannedFile=el.files?.[0]||null;scannedData='';if(scannedFile){try{scannedData=await shrink(scannedFile);$('#receiptThumb').innerHTML=`<img alt="Kassenbon-Vorschau" class="receipt-preview" src="${scannedData}">`}catch{$('#receiptThumb').textContent='Foto nicht lesbar'}}}if(el.id==='importInput'&&el.files?.[0]){try{let d=JSON.parse(await el.files[0].text());if(!d.festival||!Array.isArray(d.shopping)||!Array.isArray(d.packing)||!Array.isArray(d.ledger)||!Array.isArray(d.timeline)||!Array.isArray(d.chat)||!Array.isArray(d.receipts))throw Error('Format');if(confirm('Aktuelle Daten durch die importierte Sicherung ersetzen?')){state=d;save();close();active='home';render();toast('Sicherung importiert')}}catch{alert('Ungültige FestivalCrew-Sicherung')}}});
document.addEventListener('submit',e=>{let f=e.target;if(!f.id)return;e.preventDefault();let id=f.id,now=new Date().toISOString();try{if(id==='shopForm'){if(n(field(f,'qty'))<=0)return;state.shopping.push({id:uuid(),title:field(f,'title'),qty:n(field(f,'qty')),unit:field(f,'unit'),price:n(field(f,'price')),owner:field(f,'owner'),bought:false})}
else if(id==='packForm'){state.packing.push({id:uuid(),title:field(f,'title'),category:field(f,'category'),owner:field(f,'owner'),done:false})}
else if(id==='moneyForm'){let type=field(f,'type'),amount=n(field(f,'amount')),mode=field(f,'mode'),payer=field(f,'payer'),to=field(f,'to'),people=participants(f);if(amount<=0){alert('Der Betrag muss positiv sein.');return}if(type==='expense'&&mode==='split'&&!people.length){alert('Bitte mindestens eine beteiligte Person auswählen.');return}if(type==='settlement'&&payer===to){alert('Bitte zwei verschiedene Personen auswählen.');return}state.ledger.push({id:uuid(),type,amount,title:field(f,'title'),payer,from:payer,to,mode,participants:people,created:now})}
else if(id==='lineupForm'){let start=field(f,'start'),end=field(f,'end');if(end<=start){alert('Das Ende muss nach dem Beginn liegen.');return}state.timeline.push({id:uuid(),band:field(f,'band'),stage:field(f,'stage'),start,end,participants:participants(f)})}
else if(id==='chatForm'){state.chat.push({id:uuid(),message:field(f,'message'),sender:'me',created:now})}
else if(id==='memberForm'){state.festival.members.push({id:uuid(),name:field(f,'name')});close()}
else if(id==='festivalForm'){state.festival.name=field(f,'name');state.festival.date=field(f,'date');close()}
else if(id==='receiptForm'){let amount=n(field(f,'amount')),shop=field(f,'shop'),rid=uuid();if(amount<0){alert('Ungültiger Betrag');return}state.receipts.push({id:rid,shop,date:field(f,'date'),amount,image:scannedData});let mode=field(f,'mode');if(mode!=='none'&&amount>0)state.ledger.push({id:uuid(),type:'expense',title:'Kassenbon: '+shop,amount,mode,payer:field(f,'payer'),participants:state.festival.members.map(x=>x.id),receiptId:rid,created:now});close();scannedFile=null;scannedData=''}
else return;if(save()){render();toast('Gespeichert ✓')}}catch(err){console.error(err);alert('Konnte den Eintrag nicht speichern.')}});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))close()});
render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body>
</html>
